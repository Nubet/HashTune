spring.application.name=hashtune-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/hashtune}
spring.datasource.username=${DATABASE_USERNAME:hashtune}
spring.datasource.password=${DATABASE_PASSWORD:hashtune}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${AUDIO_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${AUDIO_MAX_REQUEST_SIZE:200MB}

app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.access-key=${S3_ACCESS_KEY:hashtune}
app.storage.secret-key=${S3_SECRET_KEY:hashtune-secret}
app.storage.audio-bucket=${S3_AUDIO_BUCKET:hashtune-audio}
app.storage.temp-bucket=${S3_TEMP_BUCKET:hashtune-temp}
app.audio.engine=${AUDIO_ENGINE:mock}
app.audio.max-file-size-bytes=${AUDIO_MAX_FILE_SIZE_BYTES:209715200}
app.indexing.worker-delay-ms=${INDEXING_WORKER_DELAY_MS:1000}
app.web.allowed-origin=${ALLOWED_ORIGIN:http://localhost:3000,http://127.0.0.1:3000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

info.app.name=HashTune
info.app.domain=norbertfila.com
