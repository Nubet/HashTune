spring.application.name=hashtune-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/hashtune}
spring.datasource.username=${DATABASE_USERNAME:hashtune}
spring.datasource.password=${DATABASE_PASSWORD:hashtune}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:1000}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.servlet.multipart.max-file-size=${AUDIO_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${AUDIO_MAX_REQUEST_SIZE:200MB}

app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.access-key=${S3_ACCESS_KEY:hashtune}
app.storage.secret-key=${S3_SECRET_KEY:hashtune-secret}
app.storage.audio-bucket=${S3_AUDIO_BUCKET:hashtune-audio}
app.storage.temp-bucket=${S3_TEMP_BUCKET:hashtune-temp}
app.storage.retain-library-audio=${RETAIN_LIBRARY_AUDIO:false}
app.audio.engine=${AUDIO_ENGINE:spectral}
app.audio.ffmpeg-binary=${FFMPEG_BINARY:ffmpeg}
app.audio.safety.ffprobe-binary=${FFPROBE_BINARY:ffprobe}
app.audio.safety.max-file-size-bytes=${AUDIO_MAX_FILE_SIZE_BYTES:209715200}
app.audio.safety.max-duration-ms=${AUDIO_MAX_DURATION_MS:1800000}
app.audio.safety.probe-timeout-ms=${AUDIO_PROBE_TIMEOUT_MS:10000}
app.audio.safety.ffmpeg-timeout-ms=${AUDIO_FFMPEG_TIMEOUT_MS:1800000}
app.audio.safety.max-decoded-pcm-bytes=${AUDIO_MAX_DECODED_PCM_BYTES:67108864}
app.audio.safety.max-cover-art-bytes=${AUDIO_MAX_COVER_ART_BYTES:5242880}
app.audio.safety.allowed-content-types=${AUDIO_ALLOWED_CONTENT_TYPES:audio/flac,audio/mpeg,audio/mp4,audio/ogg,audio/wav,audio/webm,audio/x-m4a,audio/x-wav}
app.audio.safety.allowed-cover-art-content-types=${AUDIO_ALLOWED_COVER_ART_CONTENT_TYPES:image/jpeg,image/png,image/webp}
app.audio.safety.allowed-container-names=${AUDIO_ALLOWED_CONTAINER_NAMES:flac,matroska,webm,mp3,mov,mp4,m4a,3gp,3g2,mj2,ogg,wav}
app.audio.fingerprint.max-peaks-per-second=${AUDIO_MAX_PEAKS_PER_SECOND:20}
app.audio.fingerprint.fan-out=${AUDIO_FAN_OUT:10}
app.identity-provider.enabled=${IDENTITY_PROVIDER_ENABLED:true}
app.identity-provider.development-fallback-enabled=${IDENTITY_PROVIDER_DEVELOPMENT_FALLBACK_ENABLED:false}
app.identity-provider.development-issuer=${IDENTITY_PROVIDER_DEVELOPMENT_ISSUER:local-development}
app.identity-provider.development-subject=${IDENTITY_PROVIDER_DEVELOPMENT_SUBJECT:local-user}
app.identity-provider.issuer-uri=${IDENTITY_PROVIDER_ISSUER_URI:}
app.identity-provider.jwk-set-uri=${IDENTITY_PROVIDER_JWK_SET_URI:}
app.identity-provider.audience=${IDENTITY_PROVIDER_AUDIENCE:}
app.indexing.worker-delay-ms=${INDEXING_WORKER_DELAY_MS:100}
app.indexing.max-attempts=${INDEXING_MAX_ATTEMPTS:3}
app.indexing.retry-backoff-ms=${INDEXING_RETRY_BACKOFF_MS:5000}
app.indexing.max-retry-backoff-ms=${INDEXING_MAX_RETRY_BACKOFF_MS:300000}
app.indexing.stale-processing-timeout-ms=${INDEXING_STALE_PROCESSING_TIMEOUT_MS:1860000}
app.web.allowed-origin=${ALLOWED_ORIGIN:http://localhost:3000,http://127.0.0.1:3000}
app.rate-limit.identity-capacity=${RATE_LIMIT_IDENTITY_CAPACITY:120}
app.rate-limit.identity-refill=1m
app.rate-limit.ip-capacity=${RATE_LIMIT_IP_CAPACITY:300}
app.rate-limit.ip-refill=1m
app.rate-limit.expensive-identity-capacity=${RATE_LIMIT_EXPENSIVE_IDENTITY_CAPACITY:10}
app.rate-limit.expensive-identity-refill=1m
app.rate-limit.expensive-ip-capacity=${RATE_LIMIT_EXPENSIVE_IP_CAPACITY:30}
app.rate-limit.expensive-ip-refill=1m
app.rate-limit.bucket-retention=1h
app.rate-limit.max-concurrent-recognitions-per-identity=${MAX_CONCURRENT_RECOGNITIONS_PER_IDENTITY:1}
app.seed.mtg-jamendo.enabled=${MTG_JAMENDO_SEED_ENABLED:false}
app.seed.mtg-jamendo.directory=${MTG_JAMENDO_SEED_DIRECTORY:../data/dev/mtg_jamendo_mini}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

info.app.name=HashTune
info.app.domain=norbertfila.com
app.indexing.worker-enabled=${INDEXING_WORKER_ENABLED:true}
