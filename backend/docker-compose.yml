name: hashtune-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: hashtune-postgres
    environment:
      POSTGRES_DB: hashtune
      POSTGRES_USER: hashtune
      POSTGRES_PASSWORD: hashtune
    ports:
      - "5433:5432"
    volumes:
      - hashtune-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: hashtune-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hashtune
      MINIO_ROOT_PASSWORD: hashtune-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hashtune-minio:/data

volumes:
  hashtune-postgres:
  hashtune-minio:
